        <script src="scripts/MoreProjects-Card-Render.js"></script>
        <script>
            renderNavbar("More Projects");
        </script>
        <script>
            // Function to check if the card is in the viewport (when top of card enters)
            function isInViewport(element) {
                const rect = element.getBoundingClientRect();
                return (
                    rect.top <= (window.innerHeight || document.documentElement.clientHeight) && // Trigger when the top of the card enters the viewport
                    rect.left >= 0 &&
                    rect.bottom >= 0 && // Ensure the bottom of the card is still below the viewport (it doesn't need to be fully visible)
                    rect.right <= (window.innerWidth || document.documentElement.clientWidth)
                );
            }

            // Function to add the 'visible' class to cards that are in view
            function checkScroll() {
                const cards = document.querySelectorAll('.card');
                cards.forEach((card) => {
                    if (isInViewport(card)) {
                        card.classList.add('visible');
                    }
                });
            }

            // Trigger scroll check on page load and during scroll
            window.addEventListener('scroll', checkScroll);
            window.addEventListener('load', checkScroll); // Also check when the page loads
        </script>
    </body>
