<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">

        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-PHC47J4807"></script>
        <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-PHC47J4807');
        </script>

        <!-- View Point -->
        <meta name = "viewport" content= "width=device-width, initial-scale=1">

        <title>Austin Preston - Portfolio</title>

        <!-- Meta -->
        <meta name="description" content="Welcome to Austin Preston's portfolio showcasing his work in short films, broadcasting, music videos, and promotional trailers. Explore his creative projects and more.">
        <meta name="keywords" content="Austin Preston, portfolio, short films, music videos, broadcasting, trailers, promotions, creative projects">
        <meta name="author" content="Austin Preston">

        <!-- Website Icon -->
        <link rel="icon" type="image/x-icon" href="images/Website_Icon_Transparent.png">

        <!-- links to css -->
        <link rel="stylesheet" href="main.css"/>
        <link rel="stylesheet" href="mobile.css"/>
        <link rel="stylesheet" href="tablet.css"/>
        <link rel="stylesheet" href="desktop.css"/>

        <!-- Bootstrap CSS (CDN) -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

        <!--Fonts-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Play:wght@400;700&display=swap" rel="stylesheet">

    </head>

    <body id="HomeBody">
        <!--Header and Navbar-->
        <header>
            <nav id="navbarContainer"></nav>
        </header>

        <section id="introduction">
            
            <h1 id="typing-text"></h1>
            <h2>Video Editor</h2>

        </section>

        <section id="video-section">
            <div class="video-container">
                <iframe width="500" height="255" src="https://www.youtube.com/embed/eVdMiYDavvg" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
            <div class="video-container">
                <iframe width="500" height="255" src="https://www.youtube.com/embed/G8Cye74vQic" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
        </section>

        <!-- Footer -->
        <footer id="footerContainer"></footer>

        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
        <script src="scripts/Footer.js"></script>
        <script src="scripts/Navbar.js"></script>
        <script>
            renderNavbar("Home");
        </script>

        <!--Typing Script-->
        <script>
            const text = "Hello I'm Austin Preston";
            let i = 0;
        
            function type() {
                if (i < text.length) {
                    document.getElementById("typing-text").innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, 100);
                } else {
                    // After typing is done, fade in h2
                    setTimeout(() => {
                        document.querySelector("#introduction h2").style.opacity = 1;
                    }, 500); // Small delay before fading in
                }
            }
        
            window.onload = type;
        </script>

        <!--iframes Fade in-->
        <script>
            window.addEventListener('load', () => {
                document.querySelectorAll('.video-container').forEach(el => {
                    el.classList.add('visible');
                });
            });
            </script>                     

        <!--Fade background-->
        <script>
            window.addEventListener('load', () => {
                document.getElementById('HomeBody').classList.add('loaded');
            });
        </script>
    </body>
</html>
